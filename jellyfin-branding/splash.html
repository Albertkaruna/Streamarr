<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0b1020;font-family:Inter,system-ui,sans-serif}
.bg{position:absolute;inset:0;background:
 radial-gradient(900px 600px at 18% 22%,rgba(99,102,241,.38),transparent 60%),
 radial-gradient(900px 650px at 85% 80%,rgba(34,211,238,.28),transparent 60%),
 linear-gradient(160deg,#0b1020,#111833 55%,#0b1020)}
svg.waves{position:absolute;left:0;bottom:0;width:100%;height:420px;opacity:.5}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.logo{width:190px;height:190px;filter:drop-shadow(0 24px 70px rgba(99,102,241,.55))}
.w{font-size:136px;font-weight:800;letter-spacing:-4px;line-height:1;background:linear-gradient(90deg,#c7d2fe,#67e8f9);-webkit-background-clip:text;color:transparent}
.t{font-size:40px;font-weight:500;letter-spacing:3px;color:rgba(226,232,240,.75)}
</style></head><body><div class="bg"></div>
<svg class="waves" viewBox="0 0 1920 420" preserveAspectRatio="none" fill="none" stroke-linecap="round">
<path d="M0 260 C 320 180, 640 340, 960 260 S 1600 180, 1920 260" stroke="#6366f1" stroke-width="3" opacity=".7"/>
<path d="M0 310 C 320 230, 640 390, 960 310 S 1600 230, 1920 310" stroke="#22d3ee" stroke-width="3" opacity=".55"/>
<path d="M0 360 C 320 280, 640 440, 960 360 S 1600 280, 1920 360" stroke="#818cf8" stroke-width="2" opacity=".4"/></svg>
<div class="c"><img class="logo" src="logo.svg"><div class="w">Streamarr</div><div class="t">Livin' the Stream Life</div></div>
</body></html>
